<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外部學習資源 - Lulu 英文挑戰地圖</title>
  <style>
    :root{--bg:#fff6e9;--surface:#fff;--text:#294238;--muted:#708078;--line:#e3e9e4;--accent:#5f806f;--soft:#edf5f0}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Microsoft YaHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{width:min(820px,calc(100% - 32px));margin:auto}
    header{padding:54px 0 26px}
    .back{color:var(--accent);text-decoration:none;font-weight:700;font-size:14px}
    h1{font-size:34px;margin:22px 0 8px}
    .lead{color:var(--muted);line-height:1.7;margin:0}
    .notice{margin:26px 0;padding:18px 20px;border:1px dashed #d5e1da;border-radius:16px;background:#fff;color:var(--muted);line-height:1.7;font-size:14px}
    h2{font-size:20px;margin:34px 0 14px}
    .item{display:flex;justify-content:space-between;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:18px 20px;margin-bottom:11px}
    .item h3{margin:0 0 4px;font-size:16px}.item p{margin:0;color:var(--muted);font-size:13px}
    .item a{white-space:nowrap;color:var(--accent);font-weight:700;text-decoration:none;font-size:14px}
    footer{text-align:center;color:#78877f;font-size:13px;padding:48px 0 32px}
    @media(max-width:560px){.item{align-items:flex-start;flex-direction:column}}
  
    @media(max-width:600px){
      .wrap{width:min(100% - 24px,820px)}
      header{padding:40px 0 22px}
      .back{font-size:17px}
      h1{font-size:37px;line-height:1.3;margin-top:20px}
      .lead{font-size:18px;line-height:1.75}
      .notice{font-size:17px;line-height:1.75;padding:18px}
      h2{font-size:25px;margin-top:31px}
      .item{padding:19px}
      .item h3{font-size:21px;line-height:1.45}
      .item p{font-size:17px;line-height:1.65}
      .item a,.item span{font-size:16px}
      footer{font-size:14px}
    }

  
    @media(max-width:600px){
      .back{font-size:18px}
      h1{font-size:40px}
      .lead{font-size:20px}
      .notice{font-size:19px}
      h2{font-size:27px}
      .item h3{font-size:23px}
      .item p{font-size:19px}
      .item a,.item span{font-size:18px}
      footer{font-size:15px}
    }

  
@media(max-width:600px){
 .back{font-size:19px}
 h1{font-size:43px}
 .lead{font-size:21px}
 .notice{font-size:20px}
 h2{font-size:29px}
 .item h3{font-size:25px}
 .item p{font-size:20px}
 .item a,.item span{font-size:19px}
 footer{font-size:16px}
}

@media(min-width:1001px){
 .wrap{width:min(900px,calc(100% - 64px))}
 .back{font-size:18px}h1{font-size:48px;line-height:1.22}
 .lead{font-size:20px;line-height:1.75}.notice{font-size:18px;line-height:1.75}
 h2{font-size:29px}.item{padding:22px}.item h3{font-size:23px}
 .item p{font-size:18px;line-height:1.7}.item a,.item span{font-size:17px}
 footer{font-size:15px}
}
@media(min-width:601px) and (max-width:1000px){
 h1{font-size:43px}.lead{font-size:19px}.notice{font-size:18px}
 h2{font-size:27px}.item h3{font-size:22px}.item p{font-size:18px}
 .item a,.item span{font-size:17px}
}
</style>

<style id="back-to-map-emphasis">
/* 僅加強返回挑戰地圖；沿用原頁面的淡杏綠與文字色 */
a[href="index.html"]:has(> *),
a[href="index.html"] {
  display: inline-flex !important;
  align-items: center;
  gap: .4em;
  padding: .58em .9em !important;
  border: 2px solid currentColor !important;
  border-radius: 999px !important;
  text-decoration: none !important;
  font-weight: 700 !important;
  line-height: 1.2;
  background: rgba(255,255,255,.34);
  transition: transform .15s ease, background .15s ease;
}
a[href="index.html"]:hover {
  transform: translateY(-1px);
  background: rgba(255,255,255,.58);
}
</style>

</head>
<body>
  <div class="wrap">
    <header>
      <a class="back" href="index.html">← 回到挑戰地圖</a>
      <h1>外部學習資源</h1>
      <p class="lead">這裡整理歷屆試題、英文學習工具與其他實用資源。外部網站會以新分頁開啟。</p>
    </header>

    

    <section>
      <h2>歷屆試題</h2>
      <div class="item">
        <div>
          <h3>學測英文歷屆試題</h3>
          <p>網址待加入</p>
        </div>
        <span>即將加入</span>
      </div>
      <div class="item">
        <div>
          <h3>國中會考英文歷屆試題</h3>
          <p>網址待加入</p>
        </div>
        <span>即將加入</span>
      </div>
    </section>

    <section>
      <h2>查詢與學習</h2>
      <div class="item">
        <div>
          <h3>英文學習工具</h3>
          
        </div>
        <span>即將加入</span>
      </div>
    </section>

    <footer>Lulu Wu · @oohya330</footer>
  </div>
</body>
</html>
